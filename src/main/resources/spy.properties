# 1. 로깅 방식: Spring Boot의 기본 로거(SLF4J/Logback)를 통과하도록 설정
# (콘솔에 바로 찍는 StdoutLogger보다 애플리케이션 로그와 형태를 맞추는 것이 깔끔합니다)
appender=com.p6spy.engine.spy.appender.Slf4JLogger

# 2. 포맷팅: SQL 쿼리를 한 줄이 아닌 여러 줄(Multi-line)로 예쁘게 들여쓰기하여 출력
# logMessageFormat=com.p6spy.engine.spy.appender.MultiLineFormat
logMessageFormat=com.p6spy.engine.spy.appender.CustomLineFormat

# 3. 커스텀 로그 포맷 (가장 중요)
# P6Spy는 기본적으로 '바인딩 전 쿼리'와 '바인딩 후 쿼리'를 둘 다 출력해서 지저분합니다.
# 아래 설정을 통해 [실행 시간]과 [완성된 쿼리]만 깔끔하게 나오도록 조작할 수 있습니다.
# customLogMessageFormat=executionTime:%(executionTime)ms | %(category) | connection%(connectionId) \n %(sqlSingleLine)
# 2. 커스텀 포맷 지정: %(sql) 변수가 '바인딩이 완료된 최종 쿼리'를 의미합니다.
customLogMessageFormat=실행시간: %(executionTime)ms | %(category) \n%(sql)

# 4. 출력 카테고리 필터링: 불필요한 로그(resultset 등)를 제외하여 콘솔 도배 방지
excludecategories=info,debug,batch,result,resultset

# 5. 날짜 포맷 (기본값인 밀리초 타임스탬프 대신 알아보기 쉬운 시간으로 변경)
dateformat=yyyy-MM-dd HH:mm:ss

# 6. (옵션) 슬로우 쿼리 로깅
# 0이면 모든 쿼리 로깅, 500이면 500ms(0.5초) 이상 걸린 쿼리만 로깅
executionThreshold=0