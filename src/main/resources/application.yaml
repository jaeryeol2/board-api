server:
  port: 8000
  servlet:
    context-path: /api

spring:
  application:
    name: board-api
  config:
    additional-location: classpath:/config/
  profiles:
    active: local
  threads:
    virtual:
      enabled: false

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: com.board.api.zconfig.orm.JpaNamingStrategy
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true

decorator:
  datasource:
    p6spy:
      enable-logging: true
      multiline: true
      logging: slf4j
    exclude-beans: writeHikariDataSource, readHikariDataSource, routingDataSource

jasypt:
  encryptor:
    password: ${JASYPT_PASSWORD}

jwt:
  secret:
    key: ${JWT_SECRET_KEY}
