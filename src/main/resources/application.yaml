server:
  port: 8000
  servlet:
    context-path: /api
  forward-headers-strategy: native

spring:
  application:
    name: board-api
  config:
    additional-location: classpath:/config/
  profiles:
    active: local
  threads:
    virtual:
      enabled: false

  sql:
    init:
      mode: never

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: com.board.api.zconfig.orm.JpaNamingStrategy
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

decorator:
  datasource:
    p6spy:
      enable-logging: true
      multiline: true
      logging: slf4j
    # p6spy는 두 Hikari 풀만 감싼다. Lazy 프록시(dataSource) 바깥을 감싸면 트랜잭션 시작 시 커넥션을 미리 가져가 readOnly 반영 전에 write로 라우팅된다.
    exclude-beans: routingDataSource, dataSource

jasypt:
  encryptor:
    bean: encryptor
    password: ${JASYPT_PASSWORD}

jwt:
  secret:
    key: ${JWT_SECRET_KEY}
