datasource:
  read:
    hikari:
      driver-class-name: org.postgresql.Driver
      jdbc-url: jdbc:mariadb://localhost:3306/shoppingmall?useUnicode=true?serverTimezone=Asia/Seoul&characterEncoding=utf8
      username: root
      password: root
      connection-test-query: SELECT 1
      maximum-pool-size: 5
      minimum-idle: 3
      transaction-pointcut: execution(* com.project.api.services.*..*Service.*(..))
  write:
    hikari:
      driver-class-name: org.postgresql.Driver
      jdbc-url: jdbc:mariadb://localhost:3306/shoppingmall?useUnicode=true?serverTimezone=Asia/Seoul&characterEncoding=utf8
      username: root
      password: root
      connection-test-query: SELECT 1
      maximum-pool-size: 5
      minimum-idle: 3
      transaction-pointcut: execution(* com.project.api.services.*..*Service.*(..))

spring:
  servlet:
    multipart:
      maxFileSize: 10MB
      maxRequestSize: 10MB
