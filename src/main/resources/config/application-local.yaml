datasource:
  read:
    hikari:
      driver-class-name: org.postgresql.Driver
      jdbc-url: jdbc:postgresql://localhost:5432/postgres?currentSchema=board_store
      username: postgres
      password: root
      connection-test-query: SELECT 1
      maximum-pool-size: 5
      minimum-idle: 3
      transaction-pointcut: execution(* com.project.api.services.*..*Service.*(..))
  write:
    hikari:
      driver-class-name: org.postgresql.Driver
      jdbc-url: jdbc:postgresql://localhost:5432/postgres?currentSchema=board_store
      username: postgres
      password: root
      connection-test-query: SELECT 1
      maximum-pool-size: 5
      minimum-idle: 3
      transaction-pointcut: execution(* com.project.api.services.*..*Service.*(..))

spring:
  servlet:
    multipart:
      maxFileSize: 10MB
      maxRequestSize: 10MB
  cloud:
    aws:
      s3:
        endpoint: http://localhost:4566
        path-style-access-enabled: true
      credentials:
        access-key: test
        secret-key: test
      region:
        static: ap-northeast-2

  data:
    redis:
      # url:
      password:
      host: localhost
      port: 6379
      lettuce:
        pool:
          max-active: 5
