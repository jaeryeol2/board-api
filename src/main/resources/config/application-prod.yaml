datasource:
  read:
    hikari:
      driver-class-name: org.postgresql.Driver
      jdbc-url: jdbc:mariadb://localhost:3306/shoppingmall?useUnicode=true?serverTimezone=Asia/Seoul&characterEncoding=utf8
      username: root
      password: root
      connection-test-query: SELECT 1
      maximum-pool-size: 5
      minimum-idle: 3
      transaction-pointcut: execution(* com.board.api.services.*..*Service.*(..))
  write:
    hikari:
      driver-class-name: org.postgresql.Driver
      jdbc-url: jdbc:mariadb://localhost:3306/shoppingmall?useUnicode=true?serverTimezone=Asia/Seoul&characterEncoding=utf8
      username: root
      password: root
      connection-test-query: SELECT 1
      maximum-pool-size: 5
      minimum-idle: 3
      transaction-pointcut: execution(* com.board.api.services.*..*Service.*(..))

spring:
  servlet:
    multipart:
      maxFileSize: 10MB
      maxRequestSize: 10MB
  data:
    redis:
      cluster:
        max-redirects: 3
        nodes:
          - localhost:6379
      password:
      lettuce:
        pool:
          max-active: 5
management:
  endpoint:
    health:
      show-details: when_authorized
      roles: "9999"

decorator:
  datasource:
    enabled: false

logging:
  level:
    p6spy: error

front:
  url: ${FRONT_URL}
